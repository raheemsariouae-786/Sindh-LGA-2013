<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شکایت درج کروائیں — TMC سہراب گوٹھ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Nastaliq Urdu',serif; background:#f0f4f8; color:#111; direction:rtl; }
.top-bar { background:#003087; color:#fff; text-align:center; padding:9px 16px; font-size:12px; line-height:1.8; }
.top-bar strong { color:#ffe600; font-size:14px; display:block; }
.page-header {
  background:linear-gradient(180deg,#003087,#004bb5);
  padding:18px 16px; text-align:center; display:flex; align-items:center; gap:12px;
}
.page-header img { width:52px; height:52px; border-radius:50%; border:3px solid #ffe600; object-fit:contain; background:#fff; }
.page-header .ph-text { text-align:right; }
.page-header h2 { color:#fff; font-size:20px; line-height:1.5; }
.page-header p { color:rgba(255,255,255,0.8); font-size:12px; }
.back-link {
  display:inline-flex; align-items:center; gap:6px;
  background:#003087; color:#fff; text-decoration:none;
  padding:8px 16px; border-radius:20px; font-size:13px;
  margin:14px 16px 0; 
}
.container { padding:16px; max-width:600px; margin:0 auto; }
.card {
  background:#fff; border:2px solid #003087;
  border-radius:16px; padding:20px; margin-bottom:16px;
}
.card-title { color:#003087; font-size:18px; font-weight:700; margin-bottom:16px; display:block; border-bottom:2px solid #ffe600; padding-bottom:8px; }
label { display:block; color:#003087; font-size:15px; font-weight:700; margin-bottom:6px; }
input, textarea, select {
  width:100%; padding:13px; margin-bottom:14px;
  border:2px solid #003087; border-radius:10px;
  font-family:inherit; font-size:15px; color:#111;
  background:#fff;
}
input:focus, textarea:focus, select:focus { outline:none; border-color:#ffe600; box-shadow:0 0 0 3px rgba(0,48,135,0.15); }
.prob-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.prob-btn {
  background:#f0f4f8; border:2px solid #003087; border-radius:10px;
  padding:12px 8px; text-align:center; cursor:pointer;
  font-family:inherit; font-size:14px; color:#003087; font-weight:700;
  transition:all .2s;
}
.prob-btn.selected { background:#003087; color:#fff; }
.prob-btn span { display:block; font-size:24px; margin-bottom:4px; }
.submit-btn {
  width:100%; background:linear-gradient(135deg,#00873e,#005c2a);
  color:#fff; border:none; padding:18px;
  border-radius:14px; font-family:inherit; font-size:20px; font-weight:700;
  cursor:pointer; box-shadow:0 6px 20px rgba(0,135,62,0.35);
  margin-top:6px;
}
.wa-box {
  background:#e8f5ec; border:2px solid #00873e;
  border-radius:14px; padding:18px; text-align:center; margin-top:14px;
}
.wa-box p { color:#333; font-size:14px; margin-bottom:10px; line-height:1.9; }
.wa-box strong { color:#003087; font-size:18px; display:block; margin:6px 0; }
.wa-btn {
  display:inline-block; background:#00873e; color:#fff;
  text-decoration:none; padding:12px 24px; border-radius:30px;
  font-family:inherit; font-size:16px; font-weight:700; margin-top:8px;
}
.success-msg {
  display:none; background:#e8f5ec; border:2px solid #00873e;
  border-radius:14px; padding:20px; text-align:center; margin-top:16px;
}
.success-msg h3 { color:#00873e; font-size:20px; margin-bottom:8px; }
.success-msg p { color:#333; font-size:15px; line-height:1.9; }
footer { background:#003087; color:rgba(255,255,255,0.85); text-align:center; padding:20px 16px; font-size:13px; line-height:2; margin-top:20px; }
footer a { color:#ffe600; text-decoration:none; }
</style>
</head>
